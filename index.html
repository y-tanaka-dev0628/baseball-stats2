<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>野球スタッツ管理ツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>野球スタッツ管理ツール</h1>

  <nav class="view-tabs" role="tablist" aria-label="表示画面">
    <button id="inputTab" class="view-tab active" type="button" role="tab" aria-selected="true" aria-controls="inputView" data-view="inputView">入力</button>
    <button id="careerTab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="careerView" data-view="careerView">通算成績</button>
    <button id="gameStatsTab" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="gameStatsView" data-view="gameStatsView">試合別成績</button>
  </nav>

  <main>
    <section id="inputView" class="app-view" role="tabpanel" aria-labelledby="inputTab">
      <h2>試合情報</h2>

      <label>
        対戦相手：
        <input id="opponent" type="text">
      </label>

      <label>
        日付：
        <input id="date" type="date">
      </label>

      <label>
        場所：
        <input id="location" type="text">
      </label>

      <button id="addGameBtn" type="button">試合を追加</button>
      <button id="cancelGameEditBtn" type="button" hidden>編集をキャンセル</button>

      <hr>

      <h2>打席入力</h2>

      <label>
        試合選択：
        <select id="gameSelect"></select>
      </label>

      <br><br>

      <label>
        結果：
        <select id="result">
          <option>単打</option>
          <option>二塁打</option>
          <option>三塁打</option>
          <option>本塁打</option>
          <option>ゴロ</option>
          <option>フライ</option>
          <option>三振</option>
          <option>四球</option>
          <option>死球</option>
        </select>
      </label>

      <br><br>

      <label>
        方向：
        <select id="direction">
          <option>投手方向</option>
          <option>捕手方向</option>
          <option>一塁方向</option>
          <option>二塁方向</option>
          <option>三塁方向</option>
          <option>遊撃方向</option>
          <option>左翼方向</option>
          <option>中堅方向</option>
          <option>右翼方向</option>
        </select>
      </label>

      <br><br>

      <label>
        打球種類：
        <select id="battedBallType">
          <option>ゴロ</option>
          <option>フライ</option>
          <option>ライナー</option>
        </select>
      </label>

      <br><br>

      <label>
        打点：
        <input id="rbi" type="number" value="0">
      </label>

      <br><br>

      <button id="addAtBatBtn" type="button">打席を追加</button>
      <button id="cancelAtBatEditBtn" type="button" hidden>編集をキャンセル</button>

      <hr>

      <h2>打席一覧</h2>
      <div class="table-container">
        <table id="atBatTable">
          <thead>
            <tr>
              <th>試合</th>
              <th>結果</th>
              <th>方向</th>
              <th>打球種類</th>
              <th>打点</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section id="careerView" class="app-view" role="tabpanel" aria-labelledby="careerTab" hidden>
      <h2>通算成績</h2>

      <div id="stats">
        <p>打数：<span id="ab">0</span></p>
        <p>安打：<span id="hits">0</span></p>
        <p>打率：<span id="avg">.000</span></p>
        <p>長打率（SLG）：<span id="slg">.000</span></p>
        <p>出塁率：<span id="obp">.000</span></p>
        <p>OPS：<span id="ops">.000</span></p>
      </div>

      <div class="direction-stats">
        <div>
          <h3>打球方向別集計</h3>
          <div class="table-container">
            <table id="directionStatsTable">
              <thead>
                <tr>
                  <th>方向</th>
                  <th>本数</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div>
          <h3>打球方向ランキング</h3>
          <div class="table-container">
            <table id="directionRankingTable">
              <thead>
                <tr>
                  <th>順位</th>
                  <th>方向</th>
                  <th>本数</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div>
          <h3>打球方向スプレーチャート</h3>
          <svg class="spray-chart" viewBox="0 0 360 280" role="img" aria-labelledby="sprayChartTitle sprayChartDescription">
            <title id="sprayChartTitle">打球方向スプレーチャート</title>
            <desc id="sprayChartDescription">フィールド上に方向ごとの打球数を表示します。印の位置は実際の落下位置ではありません。</desc>
            <path class="spray-field" d="M180 224 L38 82 Q180 -48 322 82 Z"></path>
            <path class="spray-infield" d="M180 224 L245 159 L180 94 L115 159 Z"></path>
            <circle class="spray-base" cx="180" cy="224" r="4"></circle>
            <circle class="spray-base" cx="245" cy="159" r="4"></circle>
            <circle class="spray-base" cx="180" cy="94" r="4"></circle>
            <circle class="spray-base" cx="115" cy="159" r="4"></circle>
            <g class="spray-marker" data-direction="左翼方向" transform="translate(103 84)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">左翼</text>
            </g>
            <g class="spray-marker" data-direction="中堅方向" transform="translate(180 43)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">中堅</text>
            </g>
            <g class="spray-marker" data-direction="右翼方向" transform="translate(257 84)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">右翼</text>
            </g>
            <g class="spray-marker" data-direction="三塁方向" transform="translate(122 159)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">三塁</text>
            </g>
            <g class="spray-marker" data-direction="遊撃方向" transform="translate(150 112)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">遊撃</text>
            </g>
            <g class="spray-marker" data-direction="二塁方向" transform="translate(210 112)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">二塁</text>
            </g>
            <g class="spray-marker" data-direction="一塁方向" transform="translate(238 159)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">一塁</text>
            </g>
            <g class="spray-marker" data-direction="投手方向" transform="translate(180 159)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">投手</text>
            </g>
            <g class="spray-marker" data-direction="捕手方向" transform="translate(180 224)">
              <title></title><circle r="15"></circle><text class="spray-count" y="5">0</text><text class="spray-label" y="31">捕手</text>
            </g>
          </svg>
          <p class="spray-chart-note">方向ごとの打球数です（印は実際の落下位置ではありません）。</p>
        </div>
      </div>
    </section>

    <section id="gameStatsView" class="app-view" role="tabpanel" aria-labelledby="gameStatsTab" hidden>
      <h2>試合別成績</h2>
      <div class="table-container">
        <table id="gameTable">
          <thead>
            <tr>
              <th>日付</th>
              <th>対戦相手</th>
              <th>場所</th>
              <th>打数</th>
              <th>安打</th>
              <th>打率</th>
              <th>出塁率</th>
              <th>長打率</th>
              <th>OPS</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

<script src="app.js"></script>

</body>
</html>
