<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>野球スタッツ管理ツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>野球スタッツ管理ツール</h1>

  <h2>試合情報</h2>

  <label>
    対戦相手：
    <input id="opponent" type="text">
  </label>

  <label>
    日付：
    <input id="date" type="date">
  </label>

  <label>
    場所：
    <input id="location" type="text">
  </label>

  <button id="addGameBtn" type="button">試合を追加</button>
  <button id="cancelGameEditBtn" type="button" hidden>編集をキャンセル</button>

  <h3>試合一覧</h3>
  <div class="table-container">
    <table id="gameTable">
      <thead>
        <tr>
          <th>日付</th>
          <th>対戦相手</th>
          <th>場所</th>
          <th>打数</th>
          <th>安打</th>
          <th>打率</th>
          <th>出塁率</th>
          <th>長打率</th>
          <th>OPS</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <hr>

  <h2>打席入力</h2>

  <label>
    試合選択：
    <select id="gameSelect"></select>
  </label>

  <br><br>

  <label>
    結果：
    <select id="result">
      <option>単打</option>
      <option>二塁打</option>
      <option>三塁打</option>
      <option>本塁打</option>
      <option>ゴロ</option>
      <option>フライ</option>
      <option>三振</option>
      <option>四球</option>
      <option>死球</option>
    </select>
  </label>

  <br><br>

  <label>
    方向：
    <select id="direction">
      <option>投手方向</option>
      <option>一塁方向</option>
      <option>二塁方向</option>
      <option>三塁方向</option>
      <option>遊撃方向</option>
      <option>左翼方向</option>
      <option>中堅方向</option>
      <option>右翼方向</option>
    </select>
  </label>

  <br><br>

  <label>
    打球種類：
    <select id="battedBallType">
      <option>ゴロ</option>
      <option>フライ</option>
      <option>ライナー</option>
    </select>
  </label>

  <br><br>

  <label>
    打点：
    <input id="rbi" type="number" value="0">
  </label>

  <br><br>

  <button id="addAtBatBtn">打席を追加</button>

  <hr>

  <h2>通算成績</h2>

  <div id="stats">

   <p>打数：<span id="ab">0</span></p>
<p>安打：<span id="hits">0</span></p>
<p>打率：<span id="avg">.000</span></p>
   <p>長打率（SLG）：<span id="slg">.000</span></p>
   <p>出塁率：<span id="obp">.000</span></p>
<p>OPS：<span id="ops">.000</span></p>

</div>

<hr>

<h2>打席一覧</h2>

<table id="atBatTable">
  <thead>
    <tr>
      <th>試合ID</th>
      <th>結果</th>
      <th>方向</th>
      <th>打球種類</th>
      <th>打点</th>
      <th>削除</th>
    </tr>
  </thead>

  <tbody>
  </tbody>

</table>

<script src="app.js"></script>

</body>
</html>
